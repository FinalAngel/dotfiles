# tmux-agent-sidebar palette — Solarized Light (bg base3 #fdf6e3)
#
# The sidebar reads these once, at sidebar startup. After sourcing this file
# you must restart the sidebar (prefix+E off, prefix+E on) to see the change.

# Marks which variant is currently applied, so darkmode.zsh can skip its work
# when nothing changed (it is sourced by every interactive shell).
set -g @theme_mode light

# --- Structure ---
set -g @sidebar_color_accent             "#268bd2"  ;# blue   — active pane marker, focused headers, focused border
set -g @sidebar_color_border             "#93a1a1"  ;# base1  — unfocused borders, tab separators
set -g @sidebar_color_selection          "#eee8d5"  ;# base2  — selected row BACKGROUND (must be light here)

# --- Text hierarchy ---
set -g @sidebar_color_text_active        "#586e75"  ;# base01 — primary text
set -g @sidebar_color_text_muted         "#657b83"  ;# base00 — secondary text
set -g @sidebar_color_text_inactive      "#839496"  ;# base0  — body of unfocused rows
set -g @sidebar_color_port               "#839496"  ;# base0
set -g @sidebar_color_section_title      "#586e75"  ;# base01
set -g @sidebar_color_activity_timestamp "#93a1a1"  ;# base1

# --- Status / filter ---
set -g @sidebar_color_all                "#268bd2"  ;# blue
set -g @sidebar_color_running            "#859900"  ;# green
set -g @sidebar_color_waiting            "#b58900"  ;# yellow
set -g @sidebar_color_idle               "#839496"  ;# base0
set -g @sidebar_color_error              "#dc322f"  ;# red
set -g @sidebar_color_filter_inactive    "#93a1a1"  ;# base1
set -g @sidebar_color_wait_reason        "#cb4b16"  ;# orange

# --- Agents (this paints the row title, i.e. the session name) ---
set -g @sidebar_color_agent_claude       "#cb4b16"  ;# orange
set -g @sidebar_color_agent_codex        "#6c71c4"  ;# violet
set -g @sidebar_color_agent_opencode     "#268bd2"  ;# blue

# --- Tasks / subagents ---
set -g @sidebar_color_task_progress      "#b58900"  ;# yellow
set -g @sidebar_color_subagent           "#2aa198"  ;# cyan
set -g @sidebar_color_response_arrow     "#2aa198"  ;# cyan

# --- Git tab ---
set -g @sidebar_color_branch             "#2aa198"  ;# cyan
set -g @sidebar_color_commit_hash        "#b58900"  ;# yellow
set -g @sidebar_color_diff_added         "#859900"  ;# green
set -g @sidebar_color_diff_deleted       "#dc322f"  ;# red
set -g @sidebar_color_file_change        "#cb4b16"  ;# orange
set -g @sidebar_color_pr_link            "#6c71c4"  ;# violet

# --- Pet (only visible with @sidebar_pet on) ---
set -g @sidebar_color_pet_body           "#cb4b16"  ;# orange
set -g @sidebar_color_pet_eye            "#859900"  ;# green

# NOTE: @sidebar_color_session is parsed by the plugin but never used by the
# renderer (v0.x) — the row title takes its color from @sidebar_color_agent_*.
# Left here so it starts working if upstream wires it up.
set -g @sidebar_color_session            "#268bd2"

# Not overridable (hardcoded in src/ui/colors.rs): status_unknown (244),
# badge_danger (167), badge_auto (221), badge_plan (117).
