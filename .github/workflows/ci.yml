name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # zsh and shellcheck are installed explicitly rather than relying on
      # whatever the runner image happens to ship
      - name: Install shells and linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh shellcheck

      - name: Lint
        run: ./scripts/lint
